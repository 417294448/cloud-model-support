<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="metaTitle">Cloud LLM — Model × Region Cheat Sheet</title>
<meta name="description" content="Compare foundation model availability, regions, and lifecycle across AWS Bedrock, Azure Foundry, and GCP Vertex AI." />
<meta name="keywords" content="AWS Bedrock, Azure AI Foundry, GCP Vertex AI, foundation models, LLM comparison, model region availability, model lifecycle, Claude, GPT, Gemini, Llama, Mistral, Cohere, DeepSeek, Grok, xAI, Amazon Nova, cloud AI models, model deprecation, EOL models" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Cloud LLM Model Directory" />
<meta property="og:description" content="Compare foundation model availability, regions, and lifecycle across AWS Bedrock, Azure Foundry, and GCP Vertex AI." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root{
    /* type */
    --font-display:"Sora","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --font-body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* base — cold ink blue-black */
    --bg:#0a0e17; --panel:#10151f; --panel-2:#161c2a; --border:#232c40;
    --border-strong:#33405c;
    --ink:#e6ecf6; --muted:#8b99b6; --faint:#5b6884;
    --accent:#2f9cf4; --accent-ink:#04121f;
    --chip:#1a2233; --shadow:0 10px 34px rgba(2,6,14,.5); --radius:12px;
    --bg-grad-base:#0a0e17;
    --row-hover:#151d2f; --row-hover-2:#1a2338;
    /* semantic status palette (desaturated) */
    --c-info:#6ea8e0; --c-warn:#d29a4e; --c-danger:#d96459; --c-ok:#4fae7f; --c-accent2:#9a86d6;
  }
  html.light{
    --bg:#f4f5f8; --panel:#ffffff; --panel-2:#eef0f6; --border:#dde2ec;
    --border-strong:#c4ccdb;
    --ink:#141a28; --muted:#4f5c76; --faint:#8590a6;
    --chip:#e7ebf3; --shadow:0 8px 24px rgba(24,34,60,.09);
    --bg-grad-base:#f4f5f8;
    --row-hover:#e7ebf3; --row-hover-2:#dfe4ee;
    --c-info:#2f6fb8; --c-warn:#a9742a; --c-danger:#c2402f; --c-ok:#2b8460; --c-accent2:#6a54b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 84% -12%, color-mix(in srgb, var(--accent) 12%, var(--bg-grad-base)) 0%, transparent 60%),
      var(--bg) fixed;
    color:var(--ink);
    font:15px/1.55 var(--font-body);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background .3s,color .3s;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 22px 80px}

  /* floating control cluster (home / lang / theme) */
  .ctlbar{
    position:fixed;top:16px;right:20px;z-index:30;display:flex;align-items:center;gap:4px;
    background:color-mix(in srgb, var(--panel) 82%, transparent);
    border:1px solid var(--border);border-radius:999px;padding:4px;
    box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .ctlbar .home-link,.ctlbar .lang-toggle,.ctlbar .theme-toggle{
    position:static;height:32px;border-radius:999px;border:0;background:transparent;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    font-weight:700;font-size:12.5px;letter-spacing:.02em;transition:color .15s,background .15s;
    box-shadow:none;padding:0 12px;
  }
  .ctlbar .theme-toggle{width:32px;padding:0}
  .ctlbar .home-link:hover,.ctlbar .lang-toggle:hover,.ctlbar .theme-toggle:hover{color:var(--ink);background:var(--panel-2)}
  .ctlbar .theme-toggle svg{width:16px;height:16px;display:block}
  .ctlbar .home-link svg{width:14px;height:14px;display:block}
  @media(max-width:640px){.ctlbar{top:10px;right:10px;padding:3px}.ctlbar .home-link,.ctlbar .lang-toggle,.ctlbar .theme-toggle{height:30px;padding:0 9px}.ctlbar .theme-toggle{width:30px}}

  /* site header */
  .site-head{margin-bottom:20px;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .site-title{font-family:var(--font-display);font-size:27px;font-weight:700;margin:0 0 5px;letter-spacing:-.02em}
  .site-tagline{color:var(--muted);font-size:13.5px;margin:0;max-width:720px}

  /* provider switcher */
  .switcher{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:24px;animation:rise .5s .05s cubic-bezier(.2,.7,.3,1) both}
  .switcher button{
    position:relative;display:flex;align-items:center;gap:9px;background:transparent;border:0;color:var(--muted);
    padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;font-family:var(--font-body);transition:color .15s,background .15s;
  }
  .switcher button:hover{color:var(--ink);background:var(--panel-2)}
  .switcher button .mark{width:24px;height:24px;border-radius:7px;background:#fff;display:grid;place-items:center;padding:4px;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switcher button .mark svg{width:100%;height:100%;display:block;object-fit:contain}
  .switcher button.active{color:var(--ink);background:var(--panel-2)}
  .switcher button.active::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:2px;background:var(--accent)}

  header.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;animation:rise .5s .1s cubic-bezier(.2,.7,.3,1) both}
  .logo{width:46px;height:46px;border-radius:12px;flex:0 0 auto;background:#fff;display:grid;place-items:center;padding:8px;box-shadow:var(--shadow)}
  .logo svg{width:100%;height:100%;display:block;object-fit:contain}
  #title{font-family:var(--font-display);font-size:22px;margin:0 0 4px;letter-spacing:-.015em;font-weight:700}
  .sub{color:var(--muted);font-size:13.5px;margin:0;max-width:780px}
  .sub code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px;font-family:var(--font-mono)}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}

  .capdefs{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
  .capdefgrp-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:0 0 6px}
  .capdefgrp-row{display:flex;gap:10px;flex-wrap:wrap}
  .capdef{flex:1 1 220px;display:flex;gap:9px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .capdef .dot{margin-top:4px;flex:0 0 auto}
  .capdef b{display:block;font-size:12.5px;color:var(--ink)}
  .capdef span{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:1px}

  .tabs{display:flex;gap:4px;margin:20px 0 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
  .tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:9px 9px 0 0;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13.5px;font-family:var(--font-body);transition:color .15s,background .15s}
  .tab:hover{color:var(--ink);background:var(--panel)}
  .tab.active{color:var(--ink);background:var(--panel)}
  .tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}

  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px;animation:rise .5s .15s cubic-bezier(.2,.7,.3,1) both}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;font-family:var(--font-body)}
  input[type=search],select{background:var(--panel-2);border:1px solid var(--border);color:var(--ink);padding:9px 12px;border-radius:9px;font-size:14px;line-height:1.4;font-family:var(--font-body);min-width:180px;outline:none;transition:border-color .15s,box-shadow .15s}
  input[type=search]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  input[type=search]{min-width:240px}
  .grow{flex:1 1 240px}

  .deploybar{display:flex;flex-direction:column;gap:7px;flex:1 1 100%}
  #f-reset .minibtn{color:var(--faint)}
  #f-reset .minibtn:hover{color:var(--c-danger);border-color:color-mix(in srgb,var(--c-danger) 45%,transparent)}
  .deployrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .dgroup{display:flex;align-items:center;gap:6px}
  .dgroup .gl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--faint);margin-right:2px}
  .chip{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;line-height:1.4;font-weight:600;font-family:var(--font-body);transition:color .12s,border-color .12s,background .12s;user-select:none}
  .chip:hover{color:var(--ink);border-color:var(--border-strong)}
  .minibtn{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:9px 12px;font-size:13.5px;line-height:1.4;cursor:pointer;font-weight:600;font-family:var(--font-body);transition:color .15s,border-color .15s,background .15s;display:inline-flex;align-items:center;gap:6px}
  .minibtn:hover{color:var(--ink);border-color:var(--border-strong)}

  .count{color:var(--muted);font-size:13px;margin:0 0 14px}
  .count b{color:var(--ink);font-weight:700}

  /* inline SVG icons */
  .ic{width:14px;height:14px;flex:0 0 auto;display:inline-block;vertical-align:-2px}
  .tab .ic{width:15px;height:15px}
  .cmp-stat .ic{width:13px;height:13px;vertical-align:-1.5px}
  .site-title .ic{width:22px;height:22px;color:var(--accent);vertical-align:-3px;margin-right:2px}
  .field>label{display:flex;align-items:center;gap:5px}
  .field>label .ic{width:12px;height:12px}
  .minibtn .ic{width:13px;height:13px}
  #axisLbl{display:flex;align-items:center;gap:5px}
  #axisLbl .ic{width:12px;height:12px;color:var(--accent)}
  .capdefgrp-title .ic{width:12px;height:12px;vertical-align:-1.5px;margin-right:5px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;animation:rise .5s .2s cubic-bezier(.2,.7,.3,1) both}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;transition:border-color .18s,transform .18s,box-shadow .18s}
  .card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
  .card h3{margin:0 0 3px;font-size:15px;font-weight:700;font-family:var(--font-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .cat{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:11px}
  .ver{font-size:11px;color:var(--faint);font-family:var(--font-mono);background:var(--chip);padding:1px 6px;border-radius:5px}
  .offer{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--muted);background:var(--chip);border:1px solid var(--border);padding:1px 7px;border-radius:20px;margin-left:6px;white-space:nowrap;cursor:help}
  .offer .odot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .rowline{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:13px;flex-wrap:wrap}
  .rowline:first-of-type{border-top:0}
  .rcode{font-family:var(--font-mono);font-size:12px;color:var(--ink);min-width:118px;font-weight:500}
  .rname{color:var(--muted);font-size:11.5px;flex:1;min-width:80px}
  .mname-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .badges{display:flex;gap:4px;flex-wrap:wrap}
  .b{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.03em;white-space:nowrap;font-family:var(--font-mono)}
  .b-off{background:var(--chip);color:var(--faint);font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;font-family:var(--font-mono)}

  .matrix-scroll{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);max-height:78vh;background:var(--panel);animation:rise .5s .2s cubic-bezier(.2,.7,.3,1) both}
  table.mx{border-collapse:separate;border-spacing:0;font-size:12px}
  table.mx th,table.mx td{padding:0;white-space:nowrap}
  table.mx thead th{position:sticky;top:0;z-index:3;background:var(--panel-2);color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
  table.mx thead th .rc{display:block;font-family:var(--font-mono);font-size:10.5px;font-weight:600}
  table.mx thead th .rn{display:block;margin-top:2px;color:var(--faint);font-weight:400;font-size:9.5px;line-height:1.15;max-width:74px;white-space:normal}
  table.mx thead th.grp{background:var(--panel);color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-size:10px;border-left:1px solid var(--border)}
  table.mx th.corner{left:0;z-index:5;text-align:left;padding-left:14px}
  table.mx td.mname,table.mx th.corner{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:7px 14px;border-bottom:1px solid var(--border);max-width:250px;overflow:hidden;text-overflow:ellipsis}
  table.mx td.mname{white-space:normal;max-width:300px}
  table.mx td.mname .mp{color:var(--faint);font-size:10px}
  table.mx td.mname .mn{color:var(--ink);font-weight:600}
  table.mx td.cell{text-align:center;border-bottom:1px solid var(--border);border-left:1px solid rgba(40,50,74,.5);width:36px}
  table.mx tbody tr:hover td{background:var(--row-hover)}
  table.mx tbody tr:hover td.mname{background:var(--row-hover-2)}
  .cellwrap{display:inline-flex;gap:2px;justify-content:center;padding:6px 3px}
  .pip{width:7px;height:7px;border-radius:2px}

  .cmp-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .cmp-stat{flex:1 1 150px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 17px}
  .cmp-stat .num{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
  .cmp-stat .lbl{font-size:12px;color:var(--muted);margin-top:3px}
  .cmp-sec{margin-bottom:22px}
  .cmp-sec h4{display:flex;align-items:center;gap:9px;font-size:13px;margin:0 0 10px;font-weight:700;font-family:var(--font-display);letter-spacing:-.01em}
  .cmp-sec h4 .tag{width:9px;height:9px;border-radius:3px}
  .cmp-sec h4 .n{color:var(--faint);font-weight:600}
  .cmp-table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
  table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  table.cmp th{text-align:left;padding:9px 14px;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:var(--panel-2);font-weight:700}
  table.cmp td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  table.cmp tbody tr:last-child td{border-bottom:0}
  table.cmp tbody tr:hover td{background:var(--row-hover)}
  table.cmp .mcell .mp{color:var(--faint);font-size:10px}
  table.cmp .mcell .mn{color:var(--ink);font-weight:600}
  table.cmp .bcol{width:230px}
  .rcode-h{font-family:var(--font-mono)}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty svg{opacity:.4;margin-bottom:12px}
  footer{margin-top:44px;color:var(--faint);font-size:12px;border-top:1px solid var(--border);padding-top:18px;line-height:1.7}
  footer a{color:var(--muted)}
  @media(max-width:640px){.legend{margin-left:0}.rcode{min-width:90px}}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>

<script>
const ALL = JSON.parse(document.getElementById("data").textContent).providers;
const $=s=>document.querySelector(s);
// safe localStorage (privacy mode / sandboxed iframe / file:// may throw SecurityError)
const store={
  get(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
};
function hexRgba(h,a){h=h.replace("#","");const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

// ---- per-provider filter/view state persistence (localStorage) ----
// Each provider's selections are remembered independently and restored on reload,
// until the user hits the manual "Reset filters" button.
const STATE_KEY_PREFIX="filters:";
const statePersist={ // which state keys are persisted
  scalar:["view","region","regionB","diffOnly","hideEol","apiFilter","q","cat"],
  set:["deploy"]
};
function filtersKey(id){return STATE_KEY_PREFIX+id;}
function loadFilters(id){
  try{const raw=store.get(filtersKey(id));return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function saveFilters(){
  if(!P)return;
  const o={};
  statePersist.scalar.forEach(k=>o[k]=state[k]);
  statePersist.set.forEach(k=>o[k]=[...state[k]]);
  try{store.set(filtersKey(P.id),JSON.stringify(o));}catch(e){}
}
function clearFilters(id){try{store.set(filtersKey(id),"");}catch(e){}}
// restore a saved snapshot into `state`, clamping to values valid for provider P
function restoreFilters(snap){
  if(!snap)return;
  const regOK=c=>P.regions.some(r=>r.code===c);
  state.view=["region","compare","model","matrix"].includes(snap.view)?snap.view:"region";
  state.region=regOK(snap.region)?snap.region:(regOK(P.defA)?P.defA:P.regions[0].code);
  state.regionB=regOK(snap.regionB)?snap.regionB:(regOK(P.defB)?P.defB:P.regions[Math.min(1,P.regions.length-1)].code);
  if(state.regionB===state.region&&P.regions.length>1)state.regionB=P.regions[state.region===P.regions[0].code?1:0].code;
  state.diffOnly=!!snap.diffOnly;state.hideEol=!!snap.hideEol;
  state.apiFilter=["","rt","mt"].includes(snap.apiFilter)?snap.apiFilter:"";
  state.q=typeof snap.q==="string"?snap.q:"";
  state.cat=(snap.cat&&P.groups.includes(snap.cat))?snap.cat:"";
  const valid=new Set(P.caps.map(c=>c.k));
  state.deploy=new Set((Array.isArray(snap.deploy)?snap.deploy:[]).filter(k=>valid.has(k)));
}

// light / dark theme toggle
const THEME_ICONS={
  dark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`,
  light:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>`
};
function applyTheme(t){
  document.documentElement.classList.toggle("light",t==="light");
  store.set("theme",t);
  const btn=$("#themeToggle");
  btn.innerHTML=THEME_ICONS[t==="light"?"dark":"light"];
  const zh=(document.documentElement.lang||"en").toLowerCase().startsWith("zh");
  btn.title=t==="light"?(zh?"切换到深色主题":"Switch to dark theme"):(zh?"切换到浅色主题":"Switch to light theme");
}
(function(){
  const saved=store.get("theme");
  const preferLight=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(saved||(preferLight?"light":"dark"));
  $("#themeToggle").onclick=()=>{
    applyTheme(document.documentElement.classList.contains("light")?"dark":"light");
    if(typeof render==="function")render(); // re-resolve theme-aware status colors
  };
})();

function setProvider(id){
  P=ALL.find(p=>p.id===id);
  document.documentElement.style.setProperty("--accent",P.accent);
  document.documentElement.style.setProperty("--accent-ink",P.accentInk);
  BIT={};P.caps.forEach((c,i)=>BIT[c.k]=1<<i);
  capByK=Object.fromEntries(P.caps.map(c=>[c.k,c]));
  ALLMASK=P.caps.reduce((a,c)=>a|BIT[c.k],0);
  PIPMASK=P.pipGroups.map(g=>({...g,mask:g.keys.reduce((a,k)=>a|BIT[k],0)}));
  regionByCode=Object.fromEntries(P.regions.map(r=>[r.code,r]));

  // default state, then overlay any saved snapshot for this provider
  state.view="region";
  state.region=P.regions.some(r=>r.code===P.defA)?P.defA:P.regions[0].code;
  state.regionB=P.regions.some(r=>r.code===P.defB)?P.defB:P.regions[Math.min(1,P.regions.length-1)].code;
  state.diffOnly=true;state.hideEol=false;state.apiFilter="";state.q="";state.cat="";state.deploy=new Set(P.caps.map(c=>c.k));
  restoreFilters(loadFilters(id));
  hasLifecycle=P.models.some(mo=>mo.lifecycle&&mo.lifecycle!=="GA");
  hasApi=P.models.some(mo=>mo.api);

  // switcher active
  document.querySelectorAll("#switcher button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  // tabs reflect restored view
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===state.view));

  // header
  $("#logo").innerHTML=logo(P.id);
  $("#title").textContent=t("headTitle",{name:P.name});
  $("#sub").innerHTML=`${providerSubtitle()} <span style="color:var(--faint)">${t("headSubStats",{m:P.models.length,unit:P.unit,r:P.regions.length,c:P.caps.length,axis:axisLabelText().toLowerCase()})}</span>`;
  $("#groupLblTxt").textContent=groupLabelText();
  $("#axisLbl").innerHTML=`<svg class="ic" aria-hidden="true"><use href="#${AXIS_ICON[P.axisLabel.toLowerCase()]||"i-tag"}"/></svg><span>${axisLabelText()}</span>`;
  $("#q").placeholder=LANG==="zh"?"搜索模型名称…":(P.id==="aws"?"e.g. Claude Sonnet, Nova, Llama…":"e.g. gpt-5, o3, whisper, embedding…");
  $("#footer").innerHTML=t("footerText",{url:P.source.url,label:P.source.label,date:P.generated})+(P.note?`<br><span style="color:var(--faint)">${providerNote()}</span>`:"");

  // legend
  $("#legend").innerHTML=PIPMASK.map(g=>`<span class="lg"><span class="dot" style="background:${g.color}"></span> ${g.label}</span>`).join("");

  // capability/deployment-type definitions strip (only when the provider supplies them)
  const capDefs=$("#capDefs");
  if(P.capDefGroups&&P.capDefGroups.length){
    capDefs.style.display="";
    capDefs.innerHTML=P.capDefGroups.map(g=>`
      <div class="capdefgrp">
        ${g.title?`<div class="capdefgrp-title"><svg class="ic" aria-hidden="true"><use href="#${CAPDEF_ICON[g.title.toLowerCase()]||"i-info"}"/></svg>${capDefTitleZh(g.title)}</div>`:""}
        <div class="capdefgrp-row">${g.items.map(it=>`<div class="capdef"><span class="dot" style="background:${it.color}"></span><div><b>${it.label}</b><span>${capDefFullZh(it.label,it.full,g.title)}</span></div></div>`).join("")}</div>
      </div>`).join("");
  } else {
    capDefs.style.display="none";capDefs.innerHTML="";
  }

  buildRegionSelects();
  buildGroupSelect();
  buildChips();
  // reflect restored state into controls
  document.querySelectorAll("#deployFilter .chip").forEach(c=>styleChip(c,capByK[c.dataset.k],state.deploy.has(c.dataset.k)));
  $("#diffBtn").style.background=state.diffOnly?hexRgba(P.accent,.16):"transparent";
  $("#diffBtn").style.color=state.diffOnly?P.accent:"";
  $("#diffBtn").style.borderColor=state.diffOnly?hexRgba(P.accent,.5):"";
  $("#lifecycleBtn").style.background=state.hideEol?hexRgba(P.accent,.16):"";

  $("#catSel").value=state.cat;

}

function buildRegionSelects(){
  ["#regionSel","#regionBSel"].forEach(sel=>{
    const el=$(sel);el.innerHTML="";
    let curg=null,og;
    P.regions.forEach(r=>{
      if(r.group!==curg){curg=r.group;og=document.createElement("optgroup");og.label=r.group;el.appendChild(og);}
      const o=document.createElement("option");o.value=r.code;o.textContent=`${r.code} — ${r.name}`;og.appendChild(o);
    });
  });
  $("#regionSel").value=state.region;$("#regionBSel").value=state.regionB;
}
function buildGroupSelect(){
  const s=$("#catSel");s.innerHTML=`<option value="">${LANG==="zh"?"全部"+({"provider":"提供方","publisher":"发布方"}[P.groupLabel.toLowerCase()]||P.groupLabel):"All "+P.groupLabel.toLowerCase()+"s"}</option>`;

function buildChips(){
  const box=$("#deployFilter");box.innerHTML="";
  const mkChip=(cap,text)=>{
    const c=document.createElement("span");c.className="chip";c.dataset.k=cap.k;c.title=cap.full;c.textContent=text;
    styleChip(c,cap,true);
    c.onclick=()=>{const on=!state.deploy.has(cap.k);on?state.deploy.add(cap.k):state.deploy.delete(cap.k);styleChip(c,cap,on);saveFilters();render();};
    return c;
  };
  if(P.chipMode==="flat"){
    P.caps.forEach(cap=>box.appendChild(mkChip(cap,cap.badge)));
  }else{
    const fams=[...new Set(P.caps.map(c=>c.group))];
    fams.forEach(fam=>{
      const fAbbr=(P.caps.find(c=>c.group===fam)||{}).fAbbr;
      const g=document.createElement("div");g.className="dgroup";g.innerHTML=`<span class="gl">${fam}${fAbbr?` (${fAbbr})`:""}</span>`;
      P.caps.filter(c=>c.group===fam).forEach(cap=>g.appendChild(mkChip(cap,(cap.scope||cap.badge)+(cap.sAbbr?` (${cap.sAbbr})`:""))));
      box.appendChild(g);
    });
  }
  const all=document.createElement("button");all.className="minibtn";all.textContent=t("btnAll");
  all.onclick=()=>{state.deploy=new Set(P.caps.map(c=>c.k));document.querySelectorAll("#deployFilter .chip").forEach(c=>styleChip(c,capByK[c.dataset.k],true));saveFilters();render();};
  const none=document.createElement("button");none.className="minibtn";none.textContent=t("btnNone");
  none.onclick=()=>{state.deploy.clear();document.querySelectorAll("#deployFilter .chip").forEach(c=>styleChip(c,capByK[c.dataset.k],false));saveFilters();render();};
  box.appendChild(all);box.appendChild(none);
}
function styleChip(el,cap,on){
  el.classList.toggle("on",on);
  if(on){el.style.background=hexRgba(cap.color,.16);el.style.color=cap.color;el.style.borderColor=hexRgba(cap.color,.4);}
  else{el.style.background="";el.style.color="";el.style.borderColor="";}
}

// static events
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");state.view=t.dataset.view;
  state.q="";$("#q").value="";
  state.cat="";$("#catSel").value="";
  saveFilters();syncControls();render();
});
$("#regionSel").onchange=e=>{state.region=e.target.value;saveFilters();render();};
$("#regionBSel").onchange=e=>{state.regionB=e.target.value;saveFilters();render();};
$("#diffBtn").onclick=()=>{state.diffOnly=!state.diffOnly;$("#diffBtn").style.background=state.diffOnly?hexRgba(P.accent,.16):"transparent";saveFilters();render();};
$("#lifecycleBtn").onclick=()=>{
  state.hideEol=!state.hideEol;
  $("#lifecycleBtn").style.background=state.hideEol?hexRgba(P.accent,.16):"";
  $("#lifecycleBtn").style.color=state.hideEol?P.accent:"";
  $("#lifecycleBtn").style.borderColor=state.hideEol?hexRgba(P.accent,.5):"";
  saveFilters();render();
};
$("#q").oninput=e=>{state.q=e.target.value.trim().toLowerCase();saveFilters();render();};
$("#catSel").onchange=e=>{state.cat=e.target.value;saveFilters();render();};
$("#apiSel").onchange=e=>{state.apiFilter=e.target.value;saveFilters();render();};
$("#resetBtn").onclick=()=>{clearFilters(P.id);setProvider(P.id);};

function syncControls(){
  const v=state.view;
  $("#f-region").style.display=(v==="region"||v==="compare")?"":"none";
  $("#f-regionB").style.display=v==="compare"?"":"none";
  $("#f-diff").style.display=v==="compare"?"":"none";
  $("#f-region-lbl-txt").textContent=v==="compare"?t("lblRegionA"):t("lblRegion");
  $("#f-lifecycle").style.display=hasLifecycle?"":"none";
  $("#f-api").style.display=hasApi?"":"none";
}
function activeMask(){let m=0;state.deploy.forEach(k=>m|=BIT[k]);return m;}
function filterModels(){
  return P.models.filter(mo=>{
    if(state.hideEol&&mo.lifecycle&&mo.lifecycle!=="GA")return false;
    if(state.apiFilter&&!(mo.api&&mo.api[state.apiFilter]))return false;
    if(state.cat&&mo.g!==state.cat)return false;
    if(state.q&&!(mo.n.toLowerCase().includes(state.q)||mo.g.toLowerCase().includes(state.q)))return false;
    return true;
  });
}
function badges(mask){
  const b=P.caps.filter(c=>mask&BIT[c.k]);
  if(!b.length)return `<span class="b-off">—</span>`;
  return b.map(c=>`<span class="b" style="background:${hexRgba(c.color,.16)};color:${c.color}" title="${capFullZh(c.k)}">${c.badge}</span>`).join("");
}
// resolve semantic status colors from CSS variables so they follow the active theme
function cssVar(name,fallback){
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v||fallback;
}
function statusColors(){return{
  info:cssVar("--c-info","#6ea8e0"),warn:cssVar("--c-warn","#d29a4e"),
  danger:cssVar("--c-danger","#d96459"),ok:cssVar("--c-ok","#4fae7f"),
  accent2:cssVar("--c-accent2","#9a86d6"),muted:cssVar("--faint","#5b6884")
};}
function offerTag(mo){
  if(!mo.offer)return "";
  const SC=statusColors(),OFFERCLR={"Global":SC.info,"United States":SC.warn,"Microsoft-managed":SC.ok};
  const o=mo.offer,c=OFFERCLR[o.label]||SC.muted;
  return `<span class="offer" title="Offer availability — ${o.detail}"><span class="odot" style="background:${c}"></span>${o.short}</span>`;
}
function lifecycleTag(mo){
  if(!mo.lifecycle||mo.lifecycle==="GA")return "";
  const SC=statusColors(),LIFECLR={"Preview":SC.info,"Deprecated":SC.warn,"Legacy":SC.warn,"Retired":SC.danger,"EOL":SC.danger};
  const c=LIFECLR[mo.lifecycle]||SC.warn;
  const detail=[mo.lifecycle,mo.retirementDate?`retires ${mo.retirementDate}`:null,mo.replacement?`replacement: ${mo.replacement}`:"no replacement listed"].filter(Boolean).join(" · ");
  return `<span class="offer" title="${detail}"><span class="odot" style="background:${c}"></span>${mo.lifecycle}</span>`;
}
function apiTag(mo){
  if(!mo.api)return "";
  let out="";
  const SC=statusColors();
  if(mo.api.rt)out+=`<span class="offer" title="${t("tipRuntime")}"><span class="odot" style="background:${SC.ok}"></span>Runtime</span>`;
  if(mo.api.mt)out+=`<span class="offer" title="${t("tipMantle")}"><span class="odot" style="background:${SC.accent2}"></span>Mantle</span>`;
  return out;
}
function nameCell(mo){
  const nm=mo.card?`<a href="${mo.card}" target="_blank" rel="noopener">${mo.n}</a>`:mo.n;
  return `${nm}${mo.v?` <span class="ver">${mo.v}</span>`:""}${offerTag(mo)}${lifecycleTag(mo)}${apiTag(mo)}`;
}
function emptyMsg(t,icId){
  const icon=icId
    ?`<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#${icId}"/></svg>`
    :`<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;
  return `<div class="empty">${icon}<div>${t}</div></div>`;
}
// axis label ("Inference mode"/"Deployment type") — translated for zh, kept as-is for en
const AXIS_ZH={"inference mode":"推理模式","deployment type":"部署类型"};
const axisLow=()=>P.axisLabel.toLowerCase();
const axisWord=()=>LANG==="zh"?(AXIS_ZH[axisLow()]||P.axisLabel):axisLow()+"(s)";

function render(){
  const am=activeMask();
  const stage=$("#stage"),cnt=$("#count");
  if(!am){cnt.innerHTML="";stage.innerHTML=emptyMsg(t("emptySelectAxis",{axisSing:axisLow()}),"i-circle-off");return;}

  if(state.view==="region"){
    const r=regionByCode[state.region];
    const list=filterModels().map(mo=>({mo,mask:(mo.s[state.region]||0)&am})).filter(x=>x.mask);
    cnt.innerHTML=t("cntRegion",{n:list.length,unit:P.unit,s:list.length!==1?t("unitPlural"):"",code:r.code,name:r.name,axis:axisWord()});
    if(!list.length){stage.innerHTML=emptyMsg(t("emptyNoMatchRegion",{axis:axisWord()}));return;}
    const byg={};list.forEach(x=>{(byg[x.mo.g]=byg[x.mo.g]||[]).push(x);});
    let html='<div class="grid">';
    P.groups.filter(g=>byg[g]).forEach(g=>{
      html+=`<div class="card"><div class="cat">${g}</div>`;
      byg[g].forEach(x=>{html+=`<div class="rowline"><span class="mname-line">${nameCell(x.mo)}</span><span class="badges" style="margin-left:auto">${badges(x.mask)}</span></div>`;});
      html+='</div>';
    });
    stage.innerHTML=html+'</div>';
  }
  else if(state.view==="compare"){
    const A=regionByCode[state.region],B=regionByCode[state.regionB];
    if(state.region===state.regionB){cnt.innerHTML="";stage.innerHTML=emptyMsg(t("emptyPickTwo"),"i-columns");return;}
    const rows=filterModels().map(mo=>{
      const ma=(mo.s[state.region]||0)&am,mb=(mo.s[state.regionB]||0)&am;
      let c;if(ma&&mb)c=ma===mb?"same":"diff";else if(ma)c="onlyA";else if(mb)c="onlyB";else c="none";
      return{mo,ma,mb,cat:c};
    }).filter(x=>x.cat!=="none");
    const cats={onlyA:[],onlyB:[],diff:[],same:[]};rows.forEach(x=>cats[x.cat].push(x));
    cnt.innerHTML=t("cntCompare",{a:A.code,an:A.name,b:B.code,bn:B.name,axis:axisWord()});
    const SC=statusColors();
    let html=`<div class="cmp-summary">
      <div class="cmp-stat" style="border-left:3px solid ${SC.ok}"><div class="num">${cats.same.length+cats.diff.length}</div><div class="lbl"><svg class="ic" aria-hidden="true"><use href="#i-check-circle"/></svg> ${t("statBoth")}</div></div>
      <div class="cmp-stat" style="border-left:3px solid var(--accent)"><div class="num">${cats.onlyA.length}</div><div class="lbl"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg> ${t("statOnlyA",{a:A.code})}</div></div>
      <div class="cmp-stat" style="border-left:3px solid ${SC.accent2}"><div class="num">${cats.onlyB.length}</div><div class="lbl"><svg class="ic" aria-hidden="true" style="transform:scaleX(-1)"><use href="#i-arrow-right"/></svg> ${t("statOnlyB",{b:B.code})}</div></div>
      <div class="cmp-stat" style="border-left:3px solid ${SC.warn}"><div class="num">${cats.diff.length}</div><div class="lbl"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg> ${t("statDiff",{axis:axisWord()})}</div></div>
    </div>`;
    const sections=[
      {key:"onlyA",label:t("secOnlyA",{a:A.code,an:A.name}),color:"var(--accent)"},
      {key:"onlyB",label:t("secOnlyB",{b:B.code,bn:B.name}),color:SC.accent2},
      {key:"diff",label:t("secDiff",{axis:axisWord()}),color:SC.warn}
    ];
    if(!state.diffOnly)sections.push({key:"same",label:t("secSame"),color:SC.ok});
    const secHtml=sections.filter(s=>cats[s.key].length).map(s=>{
      const list=cats[s.key].sort((a,b)=>P.groups.indexOf(a.mo.g)-P.groups.indexOf(b.mo.g)||a.mo.n.localeCompare(b.mo.n));
      const body=list.map(x=>`<tr>
        <td class="mcell"><span class="mp">${x.mo.g}</span><br><span class="mname-line">${nameCell(x.mo)}</span></td>
        <td class="bcol"><span class="badges">${badges(x.ma)}</span></td>
        <td class="bcol"><span class="badges">${badges(x.mb)}</span></td></tr>`).join("");
      return `<div class="cmp-sec"><h4><span class="tag" style="background:${s.color}"></span>${s.label} <span class="n">· ${list.length}</span></h4>
        <div class="cmp-table-wrap"><table class="cmp"><thead><tr>
          <th>${t("thModel")}</th><th class="bcol"><span class="rcode-h">${A.code}</span> · ${A.name}</th><th class="bcol"><span class="rcode-h">${B.code}</span> · ${B.name}</th>
        </tr></thead><tbody>${body}</tbody></table></div></div>`;
    }).join("");
    html+=secHtml||emptyMsg(state.diffOnly
      ?t("emptyNoDiff",{axis:axisWord()})
      :t("emptyNeither",{axis:axisWord()}));
    stage.innerHTML=html;
  }
  else if(state.view==="model"){
    const models=filterModels().filter(mo=>Object.values(mo.s).some(mask=>mask&am));
    cnt.innerHTML=t("cntModel",{n:models.length,unit:P.unit,s:models.length!==1?t("unitPlural"):""});
    if(!models.length){stage.innerHTML=emptyMsg(t("emptyNoMatch"));return;}
    let html='<div class="grid">';
    models.forEach(mo=>{
      const regs=P.regions.filter(r=>(mo.s[r.code]||0)&am);
      html+=`<div class="card"><div class="cat">${mo.g}</div><h3>${nameCell(mo)}</h3>`;
      regs.forEach(r=>{html+=`<div class="rowline"><span class="rcode">${r.code}</span><span class="rname">${r.name}</span><span class="badges">${badges(mo.s[r.code]&am)}</span></div>`;});
      if(!regs.length)html+=`<div class="rowline"><span class="rname">${t("notAvailAxis",{axis:axisWord()})}</span></div>`;
      html+='</div>';
    });
    stage.innerHTML=html+'</div>';
  }
  else{ // matrix
    const models=filterModels().filter(mo=>Object.values(mo.s).some(mask=>mask&am));
    cnt.innerHTML=t("cntMatrix",{n:models.length,unit:P.unit,r:P.regions.length,axis:axisLabelText().toLowerCase()});
    if(!models.length){stage.innerHTML=emptyMsg(t("emptyNoMatch"));return;}
    const groups=[];P.regions.forEach(r=>{const last=groups[groups.length-1];if(last&&last.g===r.group)last.n++;else groups.push({g:r.group,n:1});});
    let head1=`<tr><th class="corner">${t("thModel")}</th>`;groups.forEach(g=>head1+=`<th class="grp" colspan="${g.n}">${g.g}</th>`);head1+='</tr>';
    let head2='<tr><th class="corner"></th>';P.regions.forEach(r=>head2+=`<th title="${r.code} — ${r.name}"><span class="rc">${r.code}</span><span class="rn">${r.name}</span></th>`);head2+='</tr>';
    let body='';
    models.forEach(mo=>{
      body+=`<tr><td class="mname"><span class="mp">${mo.g}</span><br><span class="mn">${mo.n}</span>${mo.v?` <span class="ver">${mo.v}</span>`:""}${offerTag(mo)}${lifecycleTag(mo)}${apiTag(mo)}</td>`;
      P.regions.forEach(r=>{
        const mask=(mo.s[r.code]||0)&am;
        let pips='',tips=[];
        PIPMASK.forEach(g=>{if(mask&g.mask)pips+=`<span class="pip" style="background:${g.color}"></span>`;});
        P.caps.forEach(c=>{if(mask&BIT[c.k])tips.push(c.full);});
        body+=`<td class="cell"${tips.length?` title="${tips.join(', ')}"`:''}>${pips?`<span class="cellwrap">${pips}</span>`:''}</td>`;
      });
      body+='</tr>';
    });
    stage.innerHTML=`<div class="matrix-scroll"><table class="mx"><thead>${head1}${head2}</thead><tbody>${body}</tbody></table></div>`;
  }
}

// language toggle: persist, re-fill static nodes, then re-render current provider
$("#langToggle").onclick=()=>{
  LANG=LANG==="zh"?"en":"zh";
  store.set("lang",LANG);
  applyLang();
  applyTheme(document.documentElement.classList.contains("light")?"light":"dark"); // refresh theme tooltip lang
  if(P)setProvider(P.id);
};
applyLang();
// restore last-selected provider (fall back to the first one)
const savedProvider=store.get("provider");
setProvider(ALL.some(p=>p.id===savedProvider)?savedProvider:ALL[0].id);
</script>
</body>
</html>
